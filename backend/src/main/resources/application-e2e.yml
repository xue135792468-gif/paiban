spring:
  config:
    activate:
      on-profile: e2e
  datasource:
    url: jdbc:h2:mem:paiban_e2e;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

paiban:
  scheduling:
    max-solve-seconds: 10
  integration:
    dingtalk:
      enabled: false
      fake: true
