spring:
  config:
    activate:
      on-profile: e2e
  datasource:
    url: jdbc:h2:mem:paiban_e2e;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    # 仅 e2e 环境：Playwright 经控制台执行少量 SQL，制造票 01 之前的旧格式
    # 存量行（lesson_date 置空）；生产 profile 不启用，servlet 不会注册。
    console:
      enabled: true

paiban:
  scheduling:
    max-solve-seconds: 10
  integration:
    dingtalk:
      enabled: false
      fake: true
    feishu:
      enabled: true
      fake: true
      sync-on-startup: false
