# Production reverse proxy for the Paiban stack.
# Mounted at /etc/nginx/conf.d/paiban.conf by docker-compose.prod.yml.
#
# Certificates are read from the read-only ./deploy/certs mount:
#   fullchain.pem, privkey.pem

server {
    listen 80;
    server_name _;

    # Used by the container healthcheck; must stay reachable without TLS.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Excel imports and logo uploads are capped at 20MB by the backend.
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # TLS health check for external monitors: curl -k https://host/healthz
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        # AI imports parse large timetables batch by batch and can legitimately
        # take ten minutes; the browser timeout is 15 minutes.
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        # AI imports parse large timetables batch by batch and can legitimately
        # take ten minutes; the browser timeout is 15 minutes.
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }
}
