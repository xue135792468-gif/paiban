services:
  postgres:
    image: postgres:16-alpine
    container_name: paiban-postgres
    environment:
      POSTGRES_DB: paiban
      POSTGRES_USER: paiban
      POSTGRES_PASSWORD: paiban
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - paiban-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paiban -d paiban"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paiban
      SPRING_DATASOURCE_USERNAME: paiban
      SPRING_DATASOURCE_PASSWORD: paiban
      PAIBAN_JWT_SECRET: ${PAIBAN_JWT_SECRET:?请先设置 PAIBAN_JWT_SECRET（至少 32 个字符）}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  paiban-pgdata:
