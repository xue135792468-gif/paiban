# Production stack: TLS-terminating nginx in front of the backend and frontend.
#
#   cp .env.example .env      # set POSTGRES_PASSWORD (see below)
#   # put fullchain.pem + privkey.pem in ./deploy/certs
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml (the local / demo stack):
#   - only nginx publishes host ports (80 and 443); postgres, backend and
#     frontend are reachable only on the compose network;
#   - nginx terminates TLS with certificates from ./deploy/certs and writes
#     access logs to ./logs/nginx;
#   - POSTGRES_PASSWORD is mandatory. This is the explicit production path, so
#     failing fast on a missing database password is intentional: a silent
#     default would ship a known credential. PAIBAN_JWT_SECRET and
#     PAIBAN_AI_ENCRYPTION_KEY may stay unset - the backend entrypoint
#     generates them into ./data/app/secrets.env on first boot (ticket 03).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paiban}
      POSTGRES_USER: ${POSTGRES_USER:-paiban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env before starting the production stack}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - paiban-prod-pgdata:/var/lib/postgresql/data
    networks:
      - paiban-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paiban} -d ${POSTGRES_DB:-paiban}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-paiban}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-paiban}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env before starting the production stack}
      # Empty by default: entrypoint.sh generates and persists them on first boot.
      PAIBAN_JWT_SECRET: ${PAIBAN_JWT_SECRET:-}
      PAIBAN_AI_ENCRYPTION_KEY: ${PAIBAN_AI_ENCRYPTION_KEY:-}
      PAIBAN_SECURITY_BOOTSTRAP_ADMIN_PASSWORD: ${PAIBAN_SECURITY_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Same-origin behind nginx; set only when a separate web origin calls the API.
      PAIBAN_CORS_ALLOWED_ORIGINS: ${PAIBAN_CORS_ALLOWED_ORIGINS:-}
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    volumes:
      - ./data/uploads:/app/uploads
      # Generated secrets live here and survive container recreation.
      - ./data/app:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - paiban-internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - paiban-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - paiban-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

volumes:
  paiban-prod-pgdata:

# A plain bridge network: backend still needs outbound access to AI providers and
# optional Feishu/DingTalk endpoints. Only nginx publishes ports, so the network
# stays unreachable from outside the host.
networks:
  paiban-internal:
    driver: bridge
